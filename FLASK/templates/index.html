<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz do Flamengo</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

</head>
<body>
    <div class="quiz-container">

        <!-- Tela de Boas-vindas -->
        <div id="tela-inicial">
            <!-- Escudo local -->
            <img src="/static/img/escudo.png" alt="Escudo do Flamengo" class="escudo" />

            <h1>🔥 Bem-vindo ao Quiz do Flamengo 🔥</h1>
            <p>Mostre que você é Mengão de verdade! 🏆</p>
            <button id="start-btn">Iniciar Quiz ➡️</button>
        </div>

        <!-- Quiz -->
        <div id="quiz" style="display: none;"></div>

        <div class="controls" id="controls" style="display: none;">
            <button id="next-btn">Próxima ➡️</button>
        </div>

        <!-- Resultado -->
        <div id="resultado"></div>

    </div>

    <script src="/static/script.js"></script>
</body>
</html>
